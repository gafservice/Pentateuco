
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación Pentateuco - Tema 10</title>
    <script>
        function revisarFormulario() {
            let total = 0;
            let correctas = {
                p1: "b", p2: "a", p3: "c", p4: "b", p5: "c",
                p6: "a", p7: "b", p8: "c", p9: "a", p10: "b",
                p11: "c", p12: "a", p13: "b", p14: "c", p15: "a",
                p16: "b", p17: "c", p18: "a", p19: "b", p20: "c",
                p21: "a", p22: "b", p23: "c", p24: "a", p25: "b",
                p26: "c", p27: "a", p28: "b", p29: "c", p30: "a"
            };
            for (let i = 1; i <= 30; i++) {
                let opciones = document.getElementsByName("p" + i);
                for (let opcion of opciones) {
                    if (opcion.checked && opcion.value === correctas["p" + i]) {
                        total++;
                    }
                }
            }
            let nota = (total / 30) * 100;
            let resultado = "Obtuviste " + total + " respuestas correctas de 30. Nota: " + nota.toFixed(2) + "%\n";
            resultado += nota >= 80 ? "¡Felicidades! Has aprobado." : "Debes repetir el cuestionario para alcanzar al menos el 80%.";
            alert(resultado);
            document.getElementById("volver").style.display = "block";
        }
    </script>
</head>
<body>
    <h2>Evaluación Pentateuco - Tema 10: Jacob en casa de Labán</h2>
    <form id="formulario">
        <p>1. ¿Qué rasgo compartían Jacob y Labán?</p>
        <label><input type="radio" name="p1" value="a">Generosidad</label><br>
        <label><input type="radio" name="p1" value="b">Astucia</label><br>
        <label><input type="radio" name="p1" value="c">Piedad</label><br><br>

        <p>2. ¿Cómo consiguió Jacob a Raquel como esposa?</p>
        <label><input type="radio" name="p2" value="a">Trabajando catorce años</label><br>
        <label><input type="radio" name="p2" value="b">Pagando una dote</label><br>
        <label><input type="radio" name="p2" value="c">Siendo bendecido por su padre</label><br><br>

        <p>3. ¿Qué enseñanza saca Jacob al ser engañado por Labán?</p>
        <label><input type="radio" name="p3" value="a">Rechaza a Raquel</label><br>
        <label><input type="radio" name="p3" value="b">Se va de la casa de Labán</label><br>
        <label><input type="radio" name="p3" value="c">Reconoce la justicia divina</label><br><br>

        <!-- OMITIDO: Las preguntas 4-30 para brevedad, se completan en versión final -->

        <p>30. ¿Qué bendición trajo Jacob a la casa de Labán?</p>
        <label><input type="radio" name="p30" value="a">La bendición de Jehová</label><br>
        <label><input type="radio" name="p30" value="b">La riqueza de Raquel</label><br>
        <label><input type="radio" name="p30" value="c">Las ovejas moteadas</label><br><br>

        <button type="button" onclick="revisarFormulario()">Enviar respuestas</button>
    </form>

    <div id="volver" style="display:none; margin-top: 20px;">
        <a href="index_semana2_global.html">Evaluar otro tema</a>
    </div>
</body>
</html>
